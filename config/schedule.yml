# Loaded by sidekiq-cron — see config/initializers/sidekiq.rb.
# Runs the dispatcher every 15 minutes; it fans out one ProductSyncJob per
# active ChannelCredential (see Integrations::ScheduleProductSyncsJob).
product_sync_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::ScheduleProductSyncsJob"
  queue: integrations

yampi_order_polling_dispatch:
  cron: "*/5 * * * *"
  class: "Integrations::Yampi::OrdersPollingSchedulerJob"
  queue: integrations

# Abandoned carts move slower than orders (a cart only matters after the
# customer walked away), so 15min is enough; the cart.reminder webhook
# covers real-time capture between polls.
yampi_cart_polling_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::Yampi::CartsPollingSchedulerJob"
  queue: integrations

shopee_order_polling_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::Shopee::OrdersPollingSchedulerJob"
  queue: integrations

# Shopee: access_token dura ~4h e o refresh_token (30 dias) é rotativo.
# Rodando a cada 3h com a folga de EXPIRY_LEEWAY do job, o token é sempre
# renovado com >= 30min de margem antes de expirar.
shopee_token_refresh_dispatch:
  cron: "0 */3 * * *"
  class: "Integrations::Shopee::TokenRefreshSchedulerJob"
  queue: integrations

tiktok_order_polling_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::Tiktok::OrdersPollingSchedulerJob"
  queue: integrations

# Proxy de carrinho abandonado do TikTok Shop (não existe carrinho
# pré-checkout na API): varre pedidos UNPAID e materializa em orders
# (status unpaid, fora do faturamento) + carts (mesmo gadget do Yampi).
tiktok_unpaid_orders_sync_dispatch:
  cron: "*/20 * * * *"
  class: "Integrations::Tiktok::UnpaidOrdersSyncSchedulerJob"
  queue: integrations

# Desfecho dos pedidos unpaid: converteu (PAID+), cancelou ou, após 5 dias
# sem resposta determinável, status_unknown (para de reconsultar).
tiktok_unpaid_reconciliation_dispatch:
  cron: "*/30 * * * *"
  class: "Integrations::Tiktok::UnpaidReconciliationSchedulerJob"
  queue: integrations

# Ativado definitivamente (2026-07-24): o backfill por statements fechou em
# ~65,7% de cobertura nos últimos 30 dias — o resto são pedidos que ainda não
# apareceram em statement liquidado. Este cron drena essas pendências em lote
# pequeno (ver PendingFinancialSyncSchedulerJob::SCHEDULED_BATCH_SIZE) com
# backoff por pedido; o enqueue pós-ingestão continua existindo, este é o
# caminho garantido.
tiktok_pending_financial_sync_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::Tiktok::PendingFinancialSyncSchedulerJob"
  queue: integrations

# Motivo/status de devolução (Search Returns 202309 — Return and Refund
# API, separada da Order API e do Finance API já usados pelos crons acima).
# DESLIGADO DE PROPÓSITO (2026-07-28): só 2 valores de return_status foram
# confirmados contra produção até agora (RETURN_OR_REFUND_REQUEST_PENDING e
# BUYER_SHIPPED_ITEM, ambos in-flight — ver TiktokReturnRefundNormalizer);
# nenhum estado terminal (aprovado/rejeitado/completo/cancelado) apareceu
# ainda. Reativar exige revisão manual assim que um return real resolver em
# produção e revelar esses valores — até lá, ReturnRefundSyncJob só roda
# via enqueue manual/targeted (order_ids), nunca em sweep automático.
# tiktok_return_refund_sync_dispatch:
#   cron: "*/30 * * * *"
#   class: "Integrations::Tiktok::ReturnRefundSyncSchedulerJob"
#   queue: integrations

# Get Shop Performance 202405 (analytics/202405/shop/performance — GMV por
# formato de conteúdo, ver ShopAnalyticsSyncService). DESLIGADO DE PROPÓSITO
# (2026-07-28): rodar manualmente 1x via console primeiro
# (Integrations::Tiktok::ShopAnalyticsSyncService.call(channel_credential))
# pra confirmar o restante do shape além do gmv_breakdowns[].type
# (LIVE/VIDEO/PRODUCT_CARD, já confirmado). Dado muda pouco — 1x/dia é
# suficiente quando isso for ligado, nada de sweep de alta frequência.
# tiktok_shop_analytics_sync_dispatch:
#   cron: "0 6 * * *"
#   class: "Integrations::Tiktok::ShopAnalyticsSyncSchedulerJob"
#   queue: integrations

# Affiliate Seller API (target_collaborations/conversations — ver
# TiktokAdapter's AFFILIATE_* paths e AffiliateSyncService). DESLIGADO DE
# PROPÓSITO (2026-08-04): rodar manualmente 1x via console primeiro
# (Integrations::Tiktok::AffiliateSyncJob.perform_later(channel_credential_id))
# pra confirmar contra a Hidrabene que o sync roda limpo antes de ligar o
# cron. Dado de criador muda pouco — 30min é conservador quando ligado.
# tiktok_affiliate_sync_dispatch:
#   cron: "*/30 * * * *"
#   class: "Integrations::Tiktok::AffiliateSyncSchedulerJob"
#   queue: integrations

# idworks (ERP) has no webhooks — polling is the only option (see
# Integrations::Idworks::OrderSyncService/ProductCostSyncService class
# comments). Product cost changes infrequently, so a 6h full sync is
# enough; freight needs to reflect new orders promptly, so it polls every
# 15min with a 2h incremental window (overlap is intentional/idempotent).
idworks_product_cost_sync_dispatch:
  cron: "0 */6 * * *"
  class: "Integrations::Idworks::ScheduleProductCostSyncsJob"
  queue: integrations

idworks_order_sync_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::Idworks::ScheduleOrderSyncsJob"
  queue: integrations

# Stock going negative (overselling) is urgent in a way cost drift isn't,
# so this polls every 20min instead of riding the 6h cost-sync cadence —
# same /sku endpoint and HTTP call as idworks_product_cost_sync_dispatch,
# just a separate DataSourceConfig gate ("stock") and a separate service
# (Integrations::Idworks::StockSyncService).
idworks_stock_sync_dispatch:
  cron: "*/20 * * * *"
  class: "Integrations::Idworks::ScheduleStockSyncsJob"
  queue: integrations

# Compara quantidade vendida por SKU (Pricecom) x faturada (idworks NF) da
# última semana corrida. O fetch real de itens/NFs já está implementado; o
# dispatcher continua condicionado ao DataSourceConfig "order_reconciliation".
idworks_order_reconciliation_dispatch:
  cron: "0 6 * * 1"
  class: "Integrations::Idworks::ScheduleOrderReconciliationJob"
  queue: integrations

# LucroFrete: custo real de frete via pedidos ja casados pelo parceiro
# (/api/reports/orders). O polling antigo de /api/logs fica disponivel
# apenas para analise de cotacoes brutas, nao para real_freight_cost.
lucrofrete_orders_sync_dispatch:
  cron: "*/15 * * * *"
  class: "Integrations::Lucrofrete::OrdersSyncSchedulerJob"
  queue: integrations

pagarme_payable_sync:
  cron: "*/30 * * * *"
  class: "Financials::PagarmePayableSyncJob"
  queue: integrations

# Detecta queda anormal de pedidos e de unidades vendidas por SKU usando a
# mesma janela de 60 minutos nas 4 semanas anteriores como baseline. Roda
# alguns minutos depois dos pollings dos canais para reduzir falso positivo
# por atraso de ingestao e fecha o alerta automaticamente quando normaliza.
operational_sales_anomaly_detection:
  cron: "4,19,34,49 * * * *"
  class: "OperationalAlerts::SalesAnomalyDetectionJob"
  queue: integrations

# Fecha o ciclo das pendencias operacionais: depois que os pollings acima
# atualizam o estado local, revalida somente conflitos ainda abertos e resolve
# automaticamente os que deixaram de existir. Roda deslocado dos minutos
# cheios para dar tempo dos syncs externos terminarem. Pendencias de custo e
# reconciliacao IDWorks podem disparar refresh extraordinario, limitado a 1x/h.
operational_conflicts_reconciliation:
  cron: "7,22,37,52 * * * *"
  class: "Audits::ReconcileOpenConflictsJob"
  queue: integrations

# Safety net, not the primary trigger — see StockAlerts::ReconcileAlertsJob's
# own comment. Stock alerts fire event-driven (order deduction, channel
# sync, idworks sync); this just catches whatever slips past those. Slow
# cadence on purpose — a tight one would make this the de facto primary
# path, which is exactly what it's not meant to be.
stock_alerts_reconciliation:
  cron: "0 */3 * * *"
  class: "StockAlerts::ReconcileAlertsJob"
  queue: integrations
